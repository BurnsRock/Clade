name: Clade CI and main preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: clade-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.configure-pages.outcome == 'success' && steps.deploy.outputs.page_url || '' }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Configure GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Assemble the site
        if: steps.configure-pages.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p site/web
          cp index.html style.css site/
          cp -R web/. site/web/
          touch site/.nojekyll
      - name: Upload Pages artifact
        if: steps.configure-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy main preview
        if: steps.configure-pages.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Write preview link to the run summary
        if: steps.configure-pages.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo '## Main branch phone preview' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the main branch preview]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain Pages setup requirement
        if: steps.configure-pages.outcome != 'success'
        run: |
          {
            echo '## Phone preview not published'
            echo 'GitHub Pages is not enabled for this repository yet. In **Settings → Pages**, choose **GitHub Actions** as the build and deployment source, then rerun this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
