name: Clade CI and phone preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read

concurrency:
  group: clade-pages
  cancel-in-progress: false

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  publish:
    needs: test
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.test.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.configure-pages.outcome == 'success' && (github.event.action == 'closed' && steps.deploy.outputs.page_url || format('{0}previews/pr-{1}/', steps.deploy.outputs.page_url, github.event.number)) || '' }}
    steps:
      - name: Check out the pull request
        if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-source
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base-source
          persist-credentials: false
      - name: Configure GitHub Pages
        id: configure-pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Assemble the site
        if: steps.configure-pages.outcome == 'success'
        env:
          PR_NUMBER: ${{ github.event.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          mkdir -p site/web
          cp base-source/index.html base-source/style.css site/
          cp -R base-source/web/. site/web/
          touch site/.nojekyll
          if [ "$EVENT_ACTION" != "closed" ]; then
            preview="site/previews/pr-${PR_NUMBER}"
            mkdir -p "$preview/web"
            cp preview-source/index.html preview-source/style.css "$preview/"
            cp -R preview-source/web/. "$preview/web/"
          fi
      - name: Upload Pages artifact
        if: steps.configure-pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        if: steps.configure-pages.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Write preview link to the run summary
        if: github.event.action != 'closed' && steps.configure-pages.outcome == 'success'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.page_url }}previews/pr-${{ github.event.number }}/
        run: |
          echo '## Phone playtest preview' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open this pull request's preview]($PREVIEW_URL)" >> "$GITHUB_STEP_SUMMARY"
      - name: Explain Pages setup requirement
        if: github.event.action != 'closed' && steps.configure-pages.outcome != 'success'
        run: |
          {
            echo '## Phone preview not published'
            echo 'GitHub Pages is not enabled for this repository yet. In **Settings → Pages**, choose **GitHub Actions** as the build and deployment source, then rerun this workflow.'
            echo 'Because this repository is private, confirm its plan supports Pages first. A published Pages site is public to anyone with its URL.'
          } >> "$GITHUB_STEP_SUMMARY"
